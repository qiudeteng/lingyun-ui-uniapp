name: 需求提交
description: 新组件、新能力，或对现有交互与视觉的改进
title: "[需求] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        说明想解决的问题。若已有替代做法，也写上为什么不够用。
  - type: input
    id: component
    attributes:
      label: 相关组件
      description: 已有组件名，或拟新增的名称。不针对单个组件可写「通用」
      placeholder: lingyun-toolbars
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在缺什么，或用起来哪里别扭
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的用法、外观或行为。可以附草图说明
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 参考
      description: 系统版本、设计稿、其它组件库的对应做法。没有可留空
