name: BUG
description: 组件表现与预期不符，或无法编译、无法运行
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认用的是当前仓库版本。微信小程序请说明开发者工具与基础库版本。
  - type: input
    id: component
    attributes:
      label: 组件
      description: 出问题的组件名，例如 lingyun-picker
      placeholder: lingyun-toolbars
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行端
      multiple: true
      options:
        - 微信小程序
        - H5
        - App
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 凌云UI 版本
      placeholder: 1.0.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面到看到问题，按顺序写
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附上控制台或微信开发者工具报错原文
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、录屏、相关代码片段。没有可留空
